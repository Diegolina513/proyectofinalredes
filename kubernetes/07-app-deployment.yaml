apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: redes2
  labels:
    app.kubernetes.io/name: crud-autos
    app.kubernetes.io/part-of: crud-autos
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: crud-autos
      app.kubernetes.io/part-of: crud-autos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crud-autos
        app.kubernetes.io/part-of: crud-autos
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: session-permissions
          image: diegolina513/proyectofinalredes:v1.0.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
          args:
            - |
              chown www-data:www-data /var/lib/php/sessions
              chmod 0700 /var/lib/php/sessions
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: sessions
              mountPath: /var/lib/php/sessions
      containers:
        - name: app
          image: diegolina513/proyectofinalredes:v1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: concesionaria_mvc
            - name: DB_USER
              value: autos
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /health/live.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live.php
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: sessions
              mountPath: /var/lib/php/sessions
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/zz-sessions.ini
              subPath: zz-sessions.ini
              readOnly: true
      volumes:
        - name: sessions
          persistentVolumeClaim:
            claimName: php-sessions
        - name: php-config
          configMap:
            name: php-sessions
            defaultMode: 0444
