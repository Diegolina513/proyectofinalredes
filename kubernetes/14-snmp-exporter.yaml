apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-exporter
  namespace: redes2
  labels:
    app.kubernetes.io/name: snmp-exporter
    app.kubernetes.io/part-of: crud-autos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-exporter
        app.kubernetes.io/part-of: crud-autos
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
      - name: snmp-exporter
        image: quay.io/prometheus/snmp-exporter:v0.30.1
        args:
        - --config.file=/etc/snmp-exporter/snmp.yml
        ports:
        - name: http
          containerPort: 9116
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 96Mi
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/snmp-exporter
          readOnly: true
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: config
        secret:
          secretName: snmp-config
          defaultMode: 288
---
apiVersion: v1
kind: Service
metadata:
  name: snmp-exporter
  namespace: redes2
  labels:
    app.kubernetes.io/name: snmp-exporter
    app.kubernetes.io/part-of: crud-autos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: snmp-exporter
  ports:
  - name: http
    port: 9116
    targetPort: http
