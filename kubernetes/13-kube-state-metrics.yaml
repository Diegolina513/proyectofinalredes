apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: redes2
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: crud-autos
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-state-metrics
  namespace: redes2
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: crud-autos
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - persistentvolumeclaims
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  - statefulsets
  verbs:
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-state-metrics
  namespace: redes2
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: crud-autos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-state-metrics
subjects:
- kind: ServiceAccount
  name: kube-state-metrics
  namespace: redes2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: redes2
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: crud-autos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: crud-autos
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65534
      containers:
      - name: kube-state-metrics
        image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
        args:
        - --namespaces=redes2
        - --resources=deployments,pods,persistentvolumeclaims,replicasets,statefulsets
        ports:
        - name: http
          containerPort: 8080
        - name: telemetry
          containerPort: 8081
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: telemetry
          initialDelaySeconds: 5
          timeoutSeconds: 5
      serviceAccountName: kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: redes2
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: crud-autos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
  - name: http
    port: 8080
    targetPort: http
