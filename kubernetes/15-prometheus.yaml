apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: redes2
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: crud-autos
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 5s
    rule_files:
    - /etc/prometheus/rules.yml
    scrape_configs:
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
    - job_name: kube-state-metrics
      scrape_interval: 5s
      static_configs:
      - targets:
        - kube-state-metrics:8080
    - job_name: snmp-exporter
      static_configs:
      - targets:
        - snmp-exporter:9116
    - job_name: snmp
      scrape_interval: 15s
      scrape_timeout: 8s
      metrics_path: /snmp
      params:
        auth:
        - redes2
        module:
        - system
      static_configs:
      - targets:
        - 172.31.21.155
      relabel_configs:
      - source_labels:
        - __address__
        target_label: __param_target
      - source_labels:
        - __param_target
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
  rules.yml: |
    groups:
    - name: redes2
      interval: 5s
      rules:
      - record: redes2_app_replicas_disponibles
        expr: kube_deployment_status_replicas_available{namespace="redes2",deployment="app"}
      - record: redes2_app_replicas_deseadas
        expr: kube_deployment_spec_replicas{namespace="redes2",deployment="app"}
      - record: redes2_snmp_agente_activo_segundos
        expr: sysUpTime{job="snmp"} / 100
      - alert: Redes2AppReplicasInsuficientes
        expr: kube_deployment_status_replicas_available{namespace="redes2",deployment="app"}
          < kube_deployment_spec_replicas{namespace="redes2",deployment="app"}
        for: 5s
        labels:
          severity: warning
        annotations:
          summary: Hay menos réplicas disponibles que las solicitadas.
      - alert: Redes2SNMPNoResponde
        expr: up{job="snmp"} == 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: La consulta SNMP al agente no responde.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: redes2
  labels:
    app.kubernetes.io/name: prometheus-data
    app.kubernetes.io/part-of: crud-autos
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: redes2
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: crud-autos
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: crud-autos
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v3.13.5
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --storage.tsdb.retention.size=1GB
        ports:
        - name: http
          containerPort: 9090
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: data
          mountPath: /prometheus
        startupProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
      initContainers:
      - name: data-permissions
        image: busybox:1.37.0
        command:
        - sh
        - -ec
        - chown 65534:65534 /prometheus && chmod 0750 /prometheus
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus
      - name: data
        persistentVolumeClaim:
          claimName: prometheus-data
  strategy:
    type: Recreate
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: redes2
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: crud-autos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: http
